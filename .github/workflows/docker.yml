name: Buildear Image

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    name: Lint y Construccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: |
            DL3008
            DL4006

  construir:
      name: Contruir Imagen
      needs: revisar
      runs-on: ubuntu-latest

      steps:
        - name: Importar Checkout
          uses: actions/checkout@v4

        - name: Construir
          run: docker build -t image/${{github}} .
        
        
